name: Database Keep Alive

on:
  schedule:
    # Roda todo dia às 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - run: pip install psycopg2-binary python-dotenv

      - name: Run ping query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python keep_alive.py